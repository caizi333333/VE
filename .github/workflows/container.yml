name: Build and verify Linux container

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build app and pinned 8051 tools
        run: docker build -t ve-checked:${{ github.sha }} .
      - name: Verify Linux binaries and application
        run: |
          docker run --rm ve-checked:${{ github.sha }} sh -c 'command -v ve-as31 && command -v s51'
          docker run --rm --user root -e VE_NATIVE_8051_TEST=1 ve-checked:${{ github.sha }} npm run check
          docker run --rm --user root ve-checked:${{ github.sha }} npm run test:integration
      - name: Publish verified image
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/$(printf '%s' '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "$GH_TOKEN" | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
          docker tag ve-checked:${{ github.sha }} "$IMAGE:${{ github.sha }}"
          docker tag ve-checked:${{ github.sha }} "$IMAGE:main"
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:main"
